name: Deploy to jarvis

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-jarvis-woodpecker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, jarvis, linux]
    steps:
      - name: Pull latest into the production checkout
        run: |
          git config --global --add safe.directory /home/gautier/docker/woodpecker
          cd /home/gautier/docker/woodpecker
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart stack
        run: |
          cd /home/gautier/docker/woodpecker
          docker compose up -d --build

      - name: Verify the container is running
        run: |
          cd /home/gautier/docker/woodpecker
          # Long-polling bot with no HTTP port: health = container stays up.
          sleep 5
          running=$(docker compose ps --status running -q | wc -l | tr -d ' ')
          if [ "$running" -lt 1 ]; then
            echo "::error::woodpecker container is not running"
            docker compose ps
            exit 1
          fi
          docker compose ps
          echo "deploy ok: container running"
