<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jolt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#E11D48" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="120" y1="170" x2="420" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="0.52" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#881337"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#glow)"/>

  <!-- icon tile (300x300 at 120,170), reusing the brand icon -->
  <g transform="translate(120 170)">
    <rect x="0" y="0" width="300" height="300" rx="66" fill="url(#tile)"/>
    <rect x="0" y="0" width="300" height="300" rx="66" fill="url(#sheen)"/>
    <g transform="scale(0.5859)">
      <path transform="translate(72 76) scale(3.6)" d="M56 12 L28 56 L48 56 L44 88 L74 42 L52 42 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="488" y="312" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">
    <tspan fill="#FFFFFF">Jolt</tspan>
  </text>
  <text x="490" y="372" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#94A3B8">The one-thing accountability bot</text>
  <text x="490" y="424" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#64748B">Powered by Claude &#183; nudges you until it&#8217;s actually done</text>
</svg>
