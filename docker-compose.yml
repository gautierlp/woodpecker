services:
  # Still named jolt, the name from before the rename: the container on jarvis is jolt.
  # A new name here makes the next deploy start a second bot next to the old one.
  jolt:
    build: .
    container_name: jolt
    restart: unless-stopped
    env_file: .env
    environment:
      # WOODPECKER_DB_PATH is intentionally NOT set here: environment: overrides env_file:
      # for the same key in Compose, so hardcoding it would make the .env value
      # (and the cutover runbook's step to edit it) silently ineffective. It comes
      # from .env instead, container-relative to the ./data mount below.
      # A persistent log file on the ./logs mount below, so history survives redeploys
      # (a recreated container otherwise loses its own stdout). Kept out of ./data so it
      # is not swept into the nightly restic backup.
      WOODPECKER_LOG_FILE: /app/logs/woodpecker.log
      # DEBUG traces message bodies and full Claude I/O; flip to INFO to quieten.
      WOODPECKER_LOG_LEVEL: DEBUG
    volumes:
      # ./data now holds only the sidecar SQLite (nag state + display snapshot);
      # the task backlog itself lives in Vikunja, not on this bind mount.
      - ./data:/app/data
      - ./logs:/app/logs
    # Join the shared NPM network so woodpecker can reach Vikunja by container name
    # (VIKUNJA_URL=http://vikunja:3456), keeping task traffic internal to the host.
    networks:
      - default
      - npm
networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
